<div class="app-layout">

  <!-- Menu Lateral Fixo -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <img
        class="logo-placeholder"
        routerLink="/home"
        src="/presenca-digital.png.png"
        alt="Logo"
      >
    </div>

    <nav class="sidebar-nav">

      <a class="nav-item" routerLink="/home">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Início</span>
      </a>

      <a class="nav-item" routerLink="/justificativa">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg>
        <span>Nova Justificativa</span>
      </a>

      <a class="nav-item active" routerLink="/solicitacoes">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <span>Solicitações</span>
      </a>

      <a class="nav-item" routerLink="/relatorio">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>Histórico</span>
      </a>

    </nav>

    <div class="sidebar-footer">
      <a class="nav-item logout" routerLink="/login">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Sair</span>
      </a>
    </div>

  </aside>


  <!-- Área de Conteúdo Principal -->
  <main class="main-content">

    <!-- Cabeçalho e Filtros -->
    <header class="content-header">

      <h1 class="page-title">Solicitações</h1>

      <div class="filters-bar">

        <div class="select-wrapper">
          <select class="custom-select">
            <option value="">Filtrar por status</option>
            <option value="pendente">Pendente</option>
            <option value="aprovado">Aprovado</option>
            <option value="reprovado">Reprovado</option>
          </select>
        </div>

        <div class="search-wrapper">

          <svg
            class="search-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>

          <input
            type="text"
            placeholder="Buscar solicitações..."
            class="search-input"
          />

        </div>

      </div>

    </header>


    <!-- Abas de Navegação -->
    <nav class="tabs-bar">

      <button class="tab-button active">
        Todas
      </button>

      <button class="tab-button">
        Pendentes
        <span class="badge">
          {{ justificativas.length }}
        </span>
      </button>

      <button class="tab-button">
        Aprovados
      </button>

      <button class="tab-button">
        Reprovados
      </button>

    </nav>


    <!-- Lista de Solicitações -->
    <div class="requests-list">

      <!--
        As justificativas enviadas serão criadas
        automaticamente aqui.
      -->
      <article
        class="request-card"
        *ngFor="let justificativa of justificativas"
      >

        <div class="card-info">

          <div class="card-title-row">

            <h3 class="card-title">
              {{ justificativa.tipoJustificativa }}
            </h3>

            <span class="status-badge pending">
              Em análise
            </span>

          </div>

          <p class="card-meta">
            {{ justificativa.dataFalta }}
          </p>

          <!-- Aviso sobre o prazo de análise -->
          <p class="justificativa-aviso">
            Justificativa enviada com sucesso! Aguarde de 5 a 7 dias
            para análise e aprovação. A resposta será enviada por
            e-mail.
          </p>

        </div>


        <div class="card-actions">

          <!-- Editar justificativa -->
          <button
            class="btn-icon edit"
            title="Editar justificativa"
            (click)="editarJustificativa(justificativa)"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M12 20h9"></path>
              <path
                d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"
              ></path>
            </svg>
          </button>


          <!-- Visualizar documento -->
          <button
            class="btn-icon view"
            title="Visualizar documento"
            (click)="visualizarDocumento(justificativa)"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
              ></path>

              <circle
                cx="12"
                cy="12"
                r="3"
              ></circle>
            </svg>
          </button>

        </div>

      </article>

    </div>

  </main>

</div>
