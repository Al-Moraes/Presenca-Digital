<div class="relatorio">
    <aside class="sidebar">
    <div class="sidebar-header">
      <img class="logo-placeholder" routerLink="/home" src="/presenca-digital.png.png" alt="Logo"> 
    </div>
    
    <nav class="sidebar-nav">
      <a  class="nav-item" routerLink="/home">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Início</span>
      </a>
      <a class="nav-item"  routerLink="/justificativa">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
        <span>Nova Justificativa</span>
      </a>
      <a  class="nav-item" routerLink="/solicitacoes">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <span >Solicitações</span>
      </a>
      <a  class="nav-item active" routerLink="/relatorio">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span >Histórico</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a  class="nav-item logout" routerLink="/login">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <span>Sair</span>
      </a>
    </div>
  </aside>

  <main class="principal">
   <div class="cabecalho">
    <button class="voltar" (click)="voltar()"></button>
    <h1>Relatório</h1>
   </div>

   <div class="filtros">
    <div>
        <label>Período</label>

        <select [(ngModel)]="periodo" (change)="mudarPeriodo()">
            <option>Maio/2026</option>
            <option>Abril/2026</option>
            <option>Março/2026</option>
        </select>
    </div>

    <button class="exportar" (click)="exportarPDF()">Exportar PDF</button>
   </div>

   <div class="cards">

    <div class="card total">
        <span>Total</span>
        <strong>{{total}}</strong>
    </div>

    <div class="card aprovadas">
        <span>Aprovadas</span>
        <strong>{{aprovadas}}</strong>
    </div>

    <div class="card reprovadas">
    <span>Reprovadas</span>
    <strong>{{reprovadas}}</strong>
   </div>

</div>

<h2>Justificativas por motivo</h2>

<div class="grafico-area">

     <div class="grafico">
        <div class="circulo"></div>
     </div>

<div class="legenda">

<p><span class="azul"></span>Atestado Médico <b>45%</b></p>
<p><span class="verde"></span>Consulta Médica<b>25%</b></p>
<p><span class="roxo"></span>Compromisso Familiar<b>15%</b></p>
<p><span class="lilas"></span>Outros<b>15%</b></p>
 </div>

</div>

<div class="info">Relatório atualizado em 20/05/2025 ás 10:30</div>

<!-- <a class="menu"(click)="voltar()">voltar ao menu</a> -->
</main>
</div>
