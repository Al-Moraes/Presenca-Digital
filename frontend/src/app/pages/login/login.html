<div class="login-container">
  <div class="login-card">
    
    <!-- Logótipo -->
    <div class="logo-container">
      <img class="logo" src="/presenca-digital.png.png" alt="Presenca Digital"  />
    </div>

    <!-- Cabeçalho -->
    <h1 class="title">Bem-Vindo!</h1>
    <p class="subtitle">Acesse sua conta</p>

    <!-- Formulário -->
    <form class="login-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input 
          type="email" 
          id="email" 
          placeholder="Insira seu E-mail" 
        />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Digite sua senha" 
        />
      </div>
      <br>
      <!-- Botões de Ação -->
      <div class="actions">
        <button type="button" class="btn-primary" routerLink="/home">Entrar</button>
      </div>
      <!-- Link redirecionando para o Cadastro -->
       
     <!-- <a
        routerLink="/cadastro"
        class="esqueci-senha"
      >
           Já possui conta? Faça login
      </a> -->
    </form>

  </div>
</div>
